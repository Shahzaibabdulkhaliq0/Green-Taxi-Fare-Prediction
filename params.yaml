data_preparation:
  raw_data_path: data/raw/2015_Green_Taxi_Trip_Data.csv
  interim_data_dir: data/interim
  target: Fare_amount
  test_size: 0.20
  random_state: 42

feature_engineering:
  input_dir: data/interim
  output_dir: data/processed
  target: Fare_amount
  drop_columns:
    - Total_amount
    - Tip_amount
    - Tolls_amount
    - Extra
    - MTA_tax
    - Improvement_surcharge
    - Ehail_fee
    - Payment_type
    - dropoff_datetime
  pickup_datetime_format: "%m/%d/%Y %I:%M:%S %p"

model_training:
  target: Fare_amount
  experiment_name: Green-Taxi-Fare-Prediction
  cv_folds: 3
  random_state: 42

  models:
    linear_regression: {}
    random_forest: {}

  hyperparameter_tuning:
    linear_regression:
      fit_intercept: [true, false]

    random_forest:
      n_estimators: [1, 10]
      max_depth: [2, 4]
      min_samples_leaf: [1, 5]